<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROTEIRIZADOR GPS</title>
  
  <!-- Biblioteca JS da Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .auth-container {
      background-color: #121824;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-header h2 {
      color: #3b82f6;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .tagline {
      color: #f97316;
      font-weight: bold;
      margin: 6px 0 2px 0;
      font-size: 0.95rem;
    }

    .sub-tagline {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .auth-tabs {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: #94a3b8;
      padding: 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #1e293b;
      color: #ffffff;
    }

    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 12px;
    }

    .input-wrapper:focus-within {
      border-color: #3b82f6;
    }

    .input-icon {
      font-size: 1rem;
      margin-right: 8px;
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 12px 0;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background-color: #059669;
    }

    .auth-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .price-highlight {
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h2>ROTEIRIZADOR GPS</h2>
      <p class="tagline">De entregador para os entregadores</p>
      <p class="sub-tagline">Simples e fácil de usar</p>
    </div>

    <!-- Alternador de Abas -->
    <div class="auth-tabs">
      <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Entrar</button>
      <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')">Criar Conta</button>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)">
      <!-- Campo Nome -->
      <div class="input-group signup-only" style="display: none;">
        <label for="user-name">Nome Completo (Opcional)</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="user-name" placeholder="Ex: Lucas Mello" />
        </div>
      </div>

      <!-- Campo WhatsApp -->
      <div class="input-group signup-only" style="display: none;">
        <label for="user-phone">WhatsApp com DDD (Opcional)</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="user-phone" placeholder="(11) 99999-9999" />
        </div>
      </div>

      <!-- Campo E-mail -->
      <div class="input-group">
        <label for="user-email">Endereço de E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="user-email" placeholder="seu@email.com" required />
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <label for="user-password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="user-password" placeholder="Sua senha" required />
        </div>
      </div>

      <!-- Campo Confirmar Senha -->
      <div class="input-group signup-only" style="display: none;">
        <label for="confirm-password">Confirmar Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" id="confirm-password" placeholder="Repita a senha" />
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">ENTRAR</button>
    </form>

    <div class="auth-footer">
      <p>Teste grátis por 15 dias • Depois <span class="price-highlight">R$ 25 / mês</span></p>
    </div>
  </div>

  <script>
    let currentMode = 'login';

    function switchAuthTab(mode) {
      currentMode = mode;
      const isSignup = mode === 'signup';

      document.getElementById('tab-login').classList.toggle('active', !isSignup);
      document.getElementById('tab-signup').classList.toggle('active', isSignup);

      const signupFields = document.querySelectorAll('.signup-only');
      signupFields.forEach(el => el.style.display = isSignup ? 'block' : 'none');

      document.getElementById('btn-submit').innerText = isSignup ? 'CRIAR MINHA CONTA' : 'ENTRAR';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();

      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;

      if (currentMode === 'login') {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Erro ao entrar: ' + error.message);
        else window.location.reload();
      } else {
        const confirmPassword = document.getElementById('confirm-password').value;
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;

        if (password !== confirmPassword) {
          alert('As senhas não coincidem!');
          return;
        }

        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name || null,
              whatsapp: phone || null
            }
          }
        });

        if (error) {
          alert('Erro ao criar conta: ' + error.message);
        } else {
          alert('Conta criada com sucesso!');
          window.location.reload();
        }
      }
    }
  </script>
</body>
</html>
