<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteirizador GPS - Suas Entregas Simplificadas</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; width: 100%; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; outline: none; }
    input:focus { border-color: #0284c7; }
    .btn { display: block; width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: transparent; color: #38bdf8; border: 1px solid #0284c7; margin-top: 10px; }
    .price { margin-top: 20px; font-size: 13px; color: #64748b; }
    .price span { color: #22c55e; font-weight: bold; }
    #msg { margin-top: 15px; font-size: 13px; font-weight: bold; }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ROTEIRIZADOR GPS</h1>
    <p>Crie sua conta e aproveite o acesso total por 15 dias sem custo.</p>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha">
    </div>

    <button class="btn btn-primary" onclick="handleSignUp()">CRIAR MINHA CONTA</button>
    <button class="btn btn-secondary" onclick="handleSignIn()">ENTRAR</button>

    <div id="msg"></div>

    <div class="price">
      Teste grátis por 15 dias • Depois <span>R$ 25 / mês</span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nrzudhlalctbaenesfnz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qGVIwzH69zcOyaN7eHq3Wg_QLs-lurv';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.className = '';
      msg.innerText = 'Criando conta...';

      if(!email || !password) {
        msg.className = 'error';
        msg.innerText = 'Preencha todos os campos.';
        return;
      }

      const { data, error } = await _supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        msg.className = 'error';
        msg.innerText = error.message;
      } else {
        msg.className = 'success';
        msg.innerText = 'Conta criada com sucesso! Verifique seu e-mail para confirmar.';
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.className = '';
      msg.innerText = 'Entrando...';

      if(!email || !password) {
        msg.className = 'error';
        msg.innerText = 'Preencha todos os campos.';
        return;
      }

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        msg.className = 'error';
        msg.innerText = error.message;
      } else {
        msg.className = 'success';
        msg.innerText = 'Login realizado com sucesso!';
      }
    }
  </script>

</body>
</html>
