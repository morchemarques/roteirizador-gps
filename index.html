<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteirizador GPS - Suas Entregas Simplificadas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; width: 100%; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 26px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .badge { display: inline-block; background: #0369a1; color: #e0f2fe; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: transparent; color: #38bdf8; border: 2px solid #0284c7; }
    .price { margin-top: 20px; font-size: 14px; color: #64748b; }
    .price span { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">🚀 Em Breve</span>
    <h1>ROTEIRIZADOR GPS</h1>
    <p>Organize suas entregas, economize combustível e otimize o seu tempo na rua.</p>
    
    <a href="#" class="btn btn-primary" onclick="alert('Área de cadastro em construção!')">CRIAR MINHA CONTA</a>
    <a href="#" class="btn btn-secondary" onclick="alert('Área de login em construção!')">ENTRAR</a>

    <div class="price">
      Teste grátis por 15 dias • Depois <span>R$ 25 / mês</span>
    </div>
  </div>

</body>
</html>
