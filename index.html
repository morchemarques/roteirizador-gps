<div class="auth-container">
  <div class="auth-header">
    <h2>ROTEIRIZADOR GPS</h2>
    <p class="tagline">De entregador para os entregadores</p>
    <p class="sub-tagline">Simples e fácil de usar</p>
  </div>

  <!-- Alternador de Abas: Login / Inscrição -->
  <div class="auth-tabs">
    <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Entrar</button>
    <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')">Criar Conta</button>
  </div>

  <form id="auth-form" onsubmit="handleAuthSubmit(event)">
    <!-- Campo: Nome (Visível apenas na Inscrição) -->
    <div class="input-group signup-only" style="display: none;">
      <label for="user-name">Nome Completo (Opcional)</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" id="user-name" placeholder="Ex: Lucas Mello" />
      </div>
    </div>

    <!-- Campo: WhatsApp (Visível apenas na Inscrição) -->
    <div class="input-group signup-only" style="display: none;">
      <label for="user-phone">WhatsApp com DDD (Opcional)</label>
      <div class="input-wrapper">
        <span class="input-icon">📱</span>
        <input type="tel" id="user-phone" placeholder="(11) 99999-9999" />
      </div>
    </div>

    <!-- Campo: E-mail (Sempre visível) -->
    <div class="input-group">
      <label for="user-email">Endereço de E-mail</label>
      <div class="input-wrapper">
        <span class="input-icon">✉️</span>
        <input type="email" id="user-email" placeholder="seu@email.com" required />
      </div>
    </div>

    <!-- Campo: Senha (Sempre visível) -->
    <div class="input-group">
      <label for="user-password">Senha</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" id="user-password" placeholder="Sua senha" required />
      </div>
    </div>

    <!-- Campo: Confirmar Senha (Visível apenas na Inscrição) -->
    <div class="input-group signup-only" style="display: none;">
      <label for="confirm-password">Confirmar Senha</label>
      <div class="input-wrapper">
        <span class="input-icon">🔑</span>
        <input type="password" id="confirm-password" placeholder="Repita a senha" />
      </div>
    </div>

    <button type="submit" id="btn-submit" class="btn-primary">ENTRAR</button>
  </form>

  <div class="auth-footer">
    <p>Teste grátis por 15 dias • Depois <span class="price-highlight">R$ 25 / mês</span></p>
  </div>
</div>
